<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}다시펴다{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍃</text></svg>">
<style>
  :root { --fg:#1f2328; --muted:#59636e; --bg:#ffffff; --card:#f6f8fa; --line:#d1d9e0;
          --accent:#2f7d4f; --accent-fg:#fff; --ok-bg:#e6f4ea; --ok-fg:#1e5631;
          --err-bg:#fdecea; --err-fg:#8a1c12; --info-bg:#e8f0fe; --info-fg:#1a3e7a; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e6edf3; --muted:#9198a1; --bg:#0d1117; --card:#161b22; --line:#30363d;
            --accent:#3fa36a; --ok-bg:#12261a; --ok-fg:#8fd6a6; --err-bg:#2d1210; --err-fg:#f1998e;
            --info-bg:#121d33; --info-fg:#9cbcf5; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif; line-height:1.6; }
  main { max-width:720px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:1.9rem; margin:0 0 16px; }
  h2 { font-size:1.3rem; margin:0 0 12px; }
  hr { border:0; border-top:1px solid var(--line); margin:28px 0; }
  .btn { display:inline-block; padding:9px 16px; border-radius:8px; border:1px solid var(--line);
         background:var(--card); color:var(--fg); font-size:0.95rem; cursor:pointer; text-decoration:none; }
  .btn:hover { border-color:var(--muted); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-fg); }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .msg { padding:12px 16px; border-radius:8px; margin:0 0 16px; }
  .msg.success { background:var(--ok-bg); color:var(--ok-fg); }
  .msg.error { background:var(--err-bg); color:var(--err-fg); }
  .msg.info { background:var(--info-bg); color:var(--info-fg); }
  label { display:block; font-size:0.9rem; margin:12px 0 4px; }
  input[type=text], input[type=password], input[type=tel] { width:100%; padding:9px 12px; border-radius:8px;
         border:1px solid var(--line); background:var(--bg); color:var(--fg); font-size:1rem; }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  .row > * { flex:1 1 0; }
  .muted { color:var(--muted); }
</style>
</head>
<body>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, m in messages %}<div class="msg {{ cat }}">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
