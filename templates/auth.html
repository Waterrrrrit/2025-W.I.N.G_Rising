{% extends "base.html" %}
{% block title %}로그인 / 회원가입 · 다시펴다{% endblock %}
{% block content %}
<h1>🔐 로그인 / 회원가입</h1>
<div class="row" style="margin-bottom:8px">
  <a class="btn {% if tab != 'register' %}primary{% endif %}" href="/auth?tab=login">로그인</a>
  <a class="btn {% if tab == 'register' %}primary{% endif %}" href="/auth?tab=register">회원가입</a>
</div>

{% if tab != 'register' %}
<form method="post" action="/login">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <label for="l_id">아이디</label>
  <input type="text" id="l_id" name="user_id" value="{{ form.get('user_id','') }}" autocomplete="username" required>
  <label for="l_pw">비밀번호</label>
  <input type="password" id="l_pw" name="password" autocomplete="current-password" required>
  <p><button class="btn primary" type="submit">로그인하기</button></p>
</form>
{% else %}
<form method="post" action="/register">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <label for="r_id">아이디</label>
  <input type="text" id="r_id" name="user_id" value="{{ form.get('user_id','') }}" autocomplete="username" required>
  <label for="r_pw">비밀번호</label>
  <input type="password" id="r_pw" name="password" autocomplete="new-password" required>
  <label for="r_pw2">비밀번호 확인</label>
  <input type="password" id="r_pw2" name="password2" autocomplete="new-password" required>
  <label for="r_name">이름</label>
  <input type="text" id="r_name" name="name" value="{{ form.get('name','') }}" required>
  <label for="r_phone">연락처 (선택)</label>
  <input type="tel" id="r_phone" name="phone" value="{{ form.get('phone','') }}">
  <label for="r_org">소속 (선택)</label>
  <input type="text" id="r_org" name="org" value="{{ form.get('org','') }}">
  <p><button class="btn primary" type="submit">회원가입하기</button></p>
</form>
{% endif %}

<hr>
<a class="btn" href="/">⬅ 메인 페이지로 돌아가기</a>
{% endblock %}
